name: Contratos

on:
  pull_request:
    paths: [diseno/contratos/**, .github/scripts/validar_ejemplos.py, .github/workflows/contratos.yml]
  push:
    branches: [main]
    paths: [diseno/contratos/**, .github/scripts/validar_ejemplos.py, .github/workflows/contratos.yml]

concurrency:
  group: contratos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ejemplos:
    name: Validar ejemplos contra esquemas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: pip install jsonschema
      - run: python .github/scripts/validar_ejemplos.py
